<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:430px;background:#0e0c11;font-family:Roboto,"Noto Sans",Arial,sans-serif;color:#f5efe6;padding:22px 16px 26px}
h2{font-size:17px;font-weight:900;margin:0 4px 4px} .sub{font-size:12px;color:rgba(245,239,230,.55);margin:0 4px 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:30px 12px;margin-top:44px}
.clap{position:relative;height:178px}
.stick{position:absolute;left:0;right:0;height:22px;border-radius:4px;overflow:hidden;background:#0b0a0f;border:1.5px solid #2a2530}
.stick.low{top:30px}
.stick.top{top:4px;transform-origin:8px 26px;transform:rotate(-11deg);z-index:2;box-shadow:0 4px 8px rgba(0,0,0,.5)}
.stripes{position:absolute;inset:0;background:repeating-linear-gradient(-55deg,#e9b949 0 14px,#0b0a0f 14px 28px,#d63447 28px 42px,#0b0a0f 42px 56px,#f5efe6 56px 70px,#0b0a0f 70px 84px)}
.stick.low .stripes{background:repeating-linear-gradient(55deg,#e9b949 0 14px,#0b0a0f 14px 28px,#d63447 28px 42px,#0b0a0f 42px 56px,#f5efe6 56px 70px,#0b0a0f 70px 84px)}
.hinge{position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f6d98c,#9c6d1c);box-shadow:0 0 0 2px #0b0a0f}
.slate{position:absolute;left:0;right:0;top:52px;bottom:0;border-radius:0 0 12px 12px;background:linear-gradient(170deg,#1c1820,#121015);border:1.5px solid #2a2530;border-top:none;padding:7px 10px 9px;box-shadow:0 10px 18px rgba(0,0,0,.55)}
.rowh{display:flex;justify-content:space-between;font-size:7.5px;letter-spacing:1.4px;color:rgba(245,239,230,.38);font-weight:800;border-bottom:1px solid rgba(245,239,230,.14);padding-bottom:3px}
.lcd{margin-top:6px;background:#050406;border-radius:5px;padding:2px 8px;font-family:"DejaVu Sans Mono",monospace;font-size:11px;font-weight:700;letter-spacing:1px;display:inline-block}
.lcd b{font-size:17px}
.name{margin-top:6px;font-size:14.5px;font-weight:900;line-height:1.15;height:34px;display:flex;align-items:flex-start;gap:5px}
.name i{font-style:normal;font-size:14px}
.line{position:absolute;left:10px;right:10px;bottom:30px;font-size:9px;color:rgba(245,239,230,.55);border-top:1px solid rgba(245,239,230,.14);padding-top:4px;display:flex;align-items:center;gap:5px}
.line span{font-size:7.5px;letter-spacing:1.2px;color:rgba(245,239,230,.35);font-weight:800}
.line em{font-style:normal;margin-left:auto;font-size:8.5px;font-weight:900;border:1.3px solid;border-radius:5px;padding:1px 5px;letter-spacing:.5px}
.go{position:absolute;left:10px;bottom:8px;font-size:10px;font-weight:900;letter-spacing:1.3px;color:#1a1408;background:linear-gradient(180deg,#f3cf74,#d9a23a);border-radius:999px;padding:3px 10px}
.cap{font-size:11px;color:rgba(245,239,230,.4);text-align:center;margin-top:18px}

.worst{display:flex;align-items:center;gap:12px;border-radius:18px;padding:14px;margin-top:18px;background:linear-gradient(90deg,#1f1a22,#151218);border:1.5px dashed rgba(148,163,184,.5)}
.worst .e{width:46px;height:46px;border-radius:12px;background:rgba(148,163,184,.15);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.worst .tt{font-weight:900;font-size:16px}.worst .ss{font-size:11.5px;color:rgba(245,239,230,.6);margin-top:2px}
.worst .go2{margin-left:auto;white-space:nowrap;font-size:10px;font-weight:900;color:#ff4d5e;border:1.5px solid #ff4d5e;border-radius:8px;padding:4px 8px;transform:rotate(-6deg);flex:none}
.ctx{font-size:10px;letter-spacing:1.5px;color:rgba(245,239,230,.35);font-weight:800;margin:4px 4px 0;text-align:center}
.dash{display:flex;align-items:center;gap:12px;border-radius:18px;padding:14px;background:#17141b;border:1.5px solid rgba(45,212,191,.45)}
.dash .e{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#2dd4bf,#d63447);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.dash .tt{font-weight:900;font-size:15px}.dash .ss{font-size:11.5px;color:rgba(245,239,230,.6);margin-top:2px}
.dash .ar{margin-left:auto;color:#e9b949;font-size:16px}
.ph{font-size:17px;font-weight:900;margin:6px 4px 12px}
.prow{display:flex;gap:10px;margin-bottom:14px}.prow div{flex:1;background:#17141b;border-radius:14px;padding:12px;text-align:center;border:1px solid #2a2530}
.prow b{display:block;font-size:20px;color:#e9b949}.prow span{font-size:10.5px;color:rgba(245,239,230,.55)}

.slate{overflow:hidden}
.bgp{position:absolute;inset:0;display:flex;gap:3px;opacity:.95}
.bgp img{flex:1;height:100%;object-fit:cover;min-width:0}
.bgshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,10,15,.55) 0%,rgba(11,10,15,.35) 35%,rgba(11,10,15,.88) 75%,rgba(11,10,15,.96) 100%)}
.slate > *:not(.bgp):not(.bgshade){position:relative;z-index:2}
.rowh{color:rgba(245,239,230,.75)!important;text-shadow:0 1px 3px #000}
.neon{margin-top:34px;font-size:15.5px;font-weight:900;line-height:1.15;color:#fff;letter-spacing:.3px}
.neon.on{text-shadow:0 0 4px #fff,0 0 10px var(--acc),0 0 20px var(--acc),0 2px 4px #000}
.neon.off{text-shadow:0 2px 4px #000;color:rgba(255,255,255,.82)}
.live{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:900;letter-spacing:1.4px;color:var(--acc);background:rgba(5,4,6,.78);border:1px solid var(--acc);border-radius:5px;padding:2px 6px;margin-top:6px}
.live i{width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 6px var(--acc)}
.live.off i{opacity:.25;box-shadow:none}
.slate > .go{position:absolute!important;left:10px;bottom:12px;z-index:3}
.clap{height:206px!important}
</style></head><body>
<h2>Hazır Çarklar</h2><div class="sub">Haftalık katalogdan otomatik oluşur • dokun ve çevir</div>
<div class="grid"><div class="clap" style="--acc:#E9B949">
  <div class="stick top"><div class="stripes"></div><div class="hinge"></div></div>
  <div class="stick low"><div class="stripes"></div></div>
  <div class="slate">
    <div class="bgp"><img src="p/l80bthReoL08m8oU74R4ZMxgnGZ.jpg"><img src="p/zhxlzxBlO1sWB1rPn7RmAoeQ2na.jpg"><img src="p/pS2R3DEiucuizVkKP80qzdO97TE.jpg"></div><div class="bgshade"></div>
    <div class="rowh"><span>SAHNE</span><span>ÇEKİM</span><span>ROLL</span></div>
    <div class="neon on">🔥 Şu An En Popüler</div>
    <div class="live on"><i></i>BU HAFTA</div>
    <div class="go">▶ ÇEVİR</div>
  </div>
</div><div class="clap" style="--acc:#2DD4BF">
  <div class="stick top"><div class="stripes"></div><div class="hinge"></div></div>
  <div class="stick low"><div class="stripes"></div></div>
  <div class="slate">
    <div class="bgp"><img src="p/7daMA65eFTxcTg58E0YoCMyAj63.jpg"><img src="p/z0XiwdrCQ9yVIr4O0pxzaAYRxdW.jpg"><img src="p/yZevl2vHQgmosfwUdVNzviIfaWS.jpg"></div><div class="bgshade"></div>
    <div class="rowh"><span>SAHNE</span><span>ÇEKİM</span><span>ROLL</span></div>
    <div class="neon on">📺 Popüler Diziler</div>
    <div class="live on"><i></i>BU HAFTA</div>
    <div class="go">▶ ÇEVİR</div>
  </div>
</div></div>
<div class="worst"><div class="e">🤦</div><div><div class="tt">Bunu Niye İzledim?</div><div class="ss">En düşük puanlı filmler çarkı</div></div><div class="go2">BUNU SEN İSTEDİN</div></div>

<div class="cap">Ana sayfa • Hazır Çarklar önizlemesi (yazılar yanıp söner)</div>
</body></html>
