<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:430px;background:#0e0c11;font-family:Roboto,"Noto Sans",Arial,sans-serif;color:#f5efe6;padding:22px 16px 30px}
.cap{font-size:11px;letter-spacing:2.2px;color:#e9b949;font-weight:900;margin:0 4px 10px}
.ticket{position:relative;height:206px;display:flex;filter:drop-shadow(0 12px 22px rgba(0,0,0,.55))}
.body,.stub{position:relative;height:100%;overflow:hidden}
/* biletin kenar çentikleri: perforasyon hizasında üst/alt yarım daire, sol kenarda tırtıl */
.body{flex:1;border-radius:18px 0 0 18px;background:#141117;
 }
.stub{width:162px;border-radius:0 18px 18px 0;background:linear-gradient(165deg,#2a1218 0%,#1a0d12 55%,#140a0e 100%);
 }
.perf{position:absolute;right:-1px;top:18px;bottom:18px;border-right:2.5px dashed rgba(233,185,73,.55);z-index:5}
.notch{position:absolute;left:calc(100% - 162px - 14px);width:28px;height:28px;border-radius:50%;background:#0e0c11;z-index:6}
.posters{position:absolute;inset:0}
.posters img{position:absolute;width:104px;height:154px;object-fit:cover;border-radius:10px;border:2px solid rgba(245,239,230,.18);box-shadow:0 6px 14px rgba(0,0,0,.6)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,10,15,.95) 0%,rgba(11,10,15,.6) 45%,rgba(11,10,15,.35) 100%),linear-gradient(0deg,rgba(11,10,15,.95) 0%,rgba(11,10,15,0) 60%)}
.edge{position:absolute;left:0;top:10px;bottom:10px;width:8px;background:radial-gradient(circle 4px at 0 50%,#0e0c11 98%,transparent) 0 0/8px 14px repeat-y;z-index:4}
.top{position:absolute;left:22px;top:16px;font-size:9.5px;letter-spacing:2px;color:rgba(245,239,230,.7);font-weight:800}
.top b{color:#e9b949}
.vs{position:absolute;left:128px;top:62px;width:42px;height:42px;border-radius:50%;background:#d63447;color:#fff;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;border:3px solid #0b0a0f;box-shadow:0 0 0 2px #e9b949,0 6px 12px rgba(0,0,0,.6);z-index:3}
.title{position:absolute;left:22px;bottom:46px;font-size:36px;font-weight:900;letter-spacing:3px;color:#e9b949;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.chip{position:absolute;left:22px;bottom:16px;display:flex;gap:8px;align-items:center}
.chip span{font-size:10.5px;font-weight:900;letter-spacing:1.5px;border-radius:6px;padding:4px 8px}
.chip .t{background:#d63447;color:#fff}
.chip .m{color:rgba(245,239,230,.65);font-weight:700;letter-spacing:.5px}
.seat{position:absolute;right:18px;top:16px;font-size:9px;letter-spacing:1.5px;color:rgba(245,239,230,.5);text-align:right;line-height:1.5;font-weight:700}
.stub .lab{position:absolute;top:12px;left:0;right:0;text-align:center;font-size:9.5px;letter-spacing:2.5px;font-weight:900;color:#e9b949}
.stub .no{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:8.5px;letter-spacing:2px;color:rgba(245,239,230,.45);font-weight:700}
.wheelwrap{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:150px;height:150px}
.rim{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#2a2030 60%,#120e15 100%);box-shadow:inset 0 0 0 3px #e9b949,0 0 26px rgba(233,185,73,.28)}
.bulbs i{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:#fff6d6;box-shadow:0 0 6px 2px rgba(255,220,130,.85)}
.wheel{position:absolute;inset:14px;border-radius:50%;background:conic-gradient(#D63447 0.0deg 30.0deg,#1E1A24 30.0deg 60.0deg,#E9B949 60.0deg 90.0deg,#1E1A24 90.0deg 120.0deg,#D63447 120.0deg 150.0deg,#1E1A24 150.0deg 180.0deg,#E9B949 180.0deg 210.0deg,#1E1A24 210.0deg 240.0deg,#D63447 240.0deg 270.0deg,#1E1A24 270.0deg 300.0deg,#E9B949 300.0deg 330.0deg,#1E1A24 330.0deg 360.0deg);box-shadow:inset 0 0 0 3px #e9b949}
.wheel::after{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(rgba(11,10,15,.55) 0 .6deg,transparent .6deg 30deg)}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;z-index:2;
 background:radial-gradient(circle at 35% 30%,#f8dc8a,#e3ac3c 60%,#b27e22);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#1a1408;font-weight:900;font-size:9px;letter-spacing:.6px;box-shadow:0 3px 10px rgba(0,0,0,.6)}
.hub b{font-size:17px;line-height:1;margin-left:2px}
.needle{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:21px solid #d63447;z-index:4;filter:drop-shadow(0 2px 2px rgba(0,0,0,.7))}
.note{font-size:11px;color:rgba(245,239,230,.45);text-align:center;margin-top:14px}
</style></head><body>
<div class="cap">BU AKŞAM NE İZLESEK?</div>
<div class="ticket">
  <div class="body">
    <div class="posters">
      <img src="p/l80bthReoL08m8oU74R4ZMxgnGZ.jpg" style="left:70px;top:20px;transform:rotate(-9deg)">
      <img src="p/zhxlzxBlO1sWB1rPn7RmAoeQ2na.jpg" style="left:160px;top:14px;transform:rotate(7deg)">
      <img src="p/pS2R3DEiucuizVkKP80qzdO97TE.jpg" style="left:115px;top:70px;transform:rotate(-2deg);opacity:.85">
    </div>
    <div class="shade"></div>
    <div class="edge"></div>
    <div class="vs">VS</div>
    <div class="top">GİRİŞ BİLETİ • <b>2 FİLM</b></div>
    <div class="title">DÜELLO</div>
    <div class="chip"><span class="t">TINDER</span><span class="m">Kaydır &amp; seç</span></div>
    
    <div class="perf"></div>
  </div>
  <div class="notch" style="top:-14px"></div><div class="notch" style="bottom:-14px"></div>
  <div class="stub">
    <div class="lab">KARAR ÇARKI</div>
    <div class="wheelwrap">
      <div class="rim"></div>
      <div class="bulbs"><i style="transform:rotate(0deg) translateY(-71px)"></i><i style="transform:rotate(20deg) translateY(-71px)"></i><i style="transform:rotate(40deg) translateY(-71px)"></i><i style="transform:rotate(60deg) translateY(-71px)"></i><i style="transform:rotate(80deg) translateY(-71px)"></i><i style="transform:rotate(100deg) translateY(-71px)"></i><i style="transform:rotate(120deg) translateY(-71px)"></i><i style="transform:rotate(140deg) translateY(-71px)"></i><i style="transform:rotate(160deg) translateY(-71px)"></i><i style="transform:rotate(180deg) translateY(-71px)"></i><i style="transform:rotate(200deg) translateY(-71px)"></i><i style="transform:rotate(220deg) translateY(-71px)"></i><i style="transform:rotate(240deg) translateY(-71px)"></i><i style="transform:rotate(260deg) translateY(-71px)"></i><i style="transform:rotate(280deg) translateY(-71px)"></i><i style="transform:rotate(300deg) translateY(-71px)"></i><i style="transform:rotate(320deg) translateY(-71px)"></i><i style="transform:rotate(340deg) translateY(-71px)"></i></div>
      <div class="wheel"></div>
      <div class="needle"></div>
      <div class="hub"><b>▶</b>ÇEVİR</div>
    </div>
    <div class="no">No. 0001</div>
  </div>
</div>
<div class="note">Bilete dokun: Düello • Koçandaki çarka dokun: filtreler + çark</div>
</body></html>
