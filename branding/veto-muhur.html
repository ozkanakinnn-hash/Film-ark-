<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:360px;height:520px;background:radial-gradient(120% 80% at 50% 20%,#1d1820,#0b0a0f 70%);font-family:Roboto,Arial,sans-serif;color:#f5efe6;display:flex;flex-direction:column;align-items:center;padding-top:26px}
.cap{font-size:11px;letter-spacing:2px;color:#e9b949;font-weight:900;margin-bottom:12px}
.poster{position:relative;width:250px;height:375px;border-radius:16px;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.6);border:1.5px solid rgba(233,185,73,.35)}
.poster img{width:100%;height:100%;object-fit:cover;transition:none}
.dim{position:absolute;inset:0;background:rgba(11,10,15,var(--dim))}
.stamp{position:absolute;left:50%;top:50%;width:210px;transform:translate(-50%,-50%) rotate(-14deg) scale(var(--sc));opacity:var(--op);filter:url(#rough)}
.stamp .box{border:7px solid #e8283c;border-radius:14px;padding:10px 0 8px;text-align:center;color:#e8283c;font-weight:900;font-size:58px;letter-spacing:10px;line-height:1;
 box-shadow:inset 0 0 0 3px rgba(232,40,60,.0);background:rgba(232,40,60,.06)}
.stamp .sub{font-size:11px;letter-spacing:3px;margin-top:4px;font-weight:900}
.ink{position:absolute;left:50%;top:50%;width:260px;height:260px;transform:translate(-50%,-50%) scale(var(--ink));border-radius:50%;
 background:radial-gradient(circle,rgba(232,40,60,.35),rgba(232,40,60,0) 65%);opacity:var(--inkop)}
.label{margin-top:14px;font-size:12px;color:rgba(245,239,230,.6)}
</style></head><body style="--sc:2.6;--op:0;--dim:0;--ink:.2;--inkop:0">
<svg width="0" height="0" style="position:absolute"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3"/>
<feComponentTransfer><feFuncA type="discrete" tableValues="0 1 1 1 1 1"/></feComponentTransfer></filter></svg>
<div class="cap">VETO HAKKI KULLANILDI</div>
<div class="poster" id="pst"><img src="p/l80bthReoL08m8oU74R4ZMxgnGZ.jpg"><div class="dim"></div><div class="ink"></div>
<div class="stamp"><div class="box">VETO<div class="sub">NE İZLESEK? • REDDEDİLDİ</div></div></div></div>
<div class="label">Çark bu filmi eler ve son kez döner</div>
</body></html>
